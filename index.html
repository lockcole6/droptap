<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DropTap</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>DropTap</h1>
        <div class="hud">
          <span>スコア <b id="score">0</b></span>
          <span>ライン <b id="lines">0</b></span>
          <span>レベル <b id="level">1</b></span>
        </div>
      </header>

      <div class="nextbar">
        <span>NEXT</span>
        <canvas id="next"></canvas>
      </div>

      <div id="board-wrap">
        <canvas id="board"></canvas>
      </div>

      <div class="controls">
        <button id="pause">一時停止</button>
        <button id="restart">リスタート</button>
      </div>

      <details class="settings">
        <summary>設定</summary>
        <label>幅
          <input id="cfg-width" type="number" min="4" max="12" value="7" />
        </label>
        <label>高さ
          <input id="cfg-height" type="number" min="8" max="24" value="12" />
        </label>
        <label>落下速度
          <select id="cfg-speed">
            <option value="900">ゆっくり</option>
            <option value="600" selected>ふつう</option>
            <option value="350">はやい</option>
          </select>
        </label>
        <button id="apply">この設定で開始</button>
      </details>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
